services:
  mysql:
    image: mysql:8.0.33
    container_name: platform_mysql
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # root 密码
      MYSQL_ROOT_PASSWORD: root
      # 初始化数据库
      MYSQL_DATABASE: ry-cloud
    ports:
      - "3306:3306"
    volumes:
      # 数据挂载
      - my_data:/var/lib/mysql/
      # 配置挂载
      - /docker/mysql/conf/:/etc/mysql/conf.d/
    command:
      # 将mysql8.0默认密码策略 修改为 原先 策略 (mysql8.0对其默认策略做了更改 会导致密码无法匹配)
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --explicit_defaults_for_timestamp=true
      --lower_case_table_names=1
    privileged: true
    networks:
      - my_network

  nacos:
    image: cdzeroly/nacos:2.2.2
    container_name: platform_nacos
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms256m -Xmx512m"
    volumes:
      # 日志目录 注意集群模式下 日志目录不能一致 需要区分例如 nacos1 nacos2
      - my_data:/root/nacos/logs
      # 集群配置文件 集群所有nacos都必须使用此文件
      - /docker/nacos/conf/cluster.conf:/root/nacos/conf/cluster.conf
    networks:
      - my_network

  redis:
    image: redis:6.2.12
    container_name: platform_redis
    ports:
      - "6379:6379"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    volumes:
      # 配置文件
      - ../docker/redis/conf:/redis/config
      # 数据文件
      - my_data:/redis/data/
    command: "redis-server /redis/config/redis.conf"
    privileged: true
    networks:
      - my_network

  minio:
    image: minio/minio:RELEASE.2023-03-24T21-41-23Z
    container_name: platform_minio
    ports:
      # api 端口
      - "9000:9000"
      # 控制台端口
      - "9001:9001"
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # 管理后台用户名
      MINIO_ROOT_USER: admin
      # 管理后台密码，最小8个字符
      MINIO_ROOT_PASSWORD: admin123
      # https需要指定域名
      #MINIO_SERVER_URL: "https://xxx.com:9000"
      #MINIO_BROWSER_REDIRECT_URL: "https://xxx.com:9001"
      # 开启压缩 on 开启 off 关闭
      MINIO_COMPRESS: "off"
      # 扩展名 .pdf,.doc 为空 所有类型均压缩
      MINIO_COMPRESS_EXTENSIONS: ""
      # mime 类型 application/pdf 为空 所有类型均压缩
      MINIO_COMPRESS_MIME_TYPES: ""
    volumes:
      # 映射当前目录下的data目录至容器内/data目录
      - .my_data:/data
      # 映射配置目录
      - ../docker/minio/config:/root/.minio/
    command: server --address ':9000' --console-address ':9001' /data  # 指定容器中的目录 /data
    privileged: true
    networks:
      - my_network

  seata-server:
    image: cdzeroly/seata-server:2.2.2
    container_name: platform_seata_server
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      TZ: Asia/Shanghai
      # 注意 此处ip如果是外网使用 要改为外网ip
      # SEATA_IP: 127.0.0.1
      SEATA_PORT: 8091
    volumes:
      - my_data:/cdzeroly/seata-server/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  nginx-web:
    image: nginx:1.22.1
    container_name: platform_nginx-web
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "80:80"
#      - "443:443"
    volumes:
      # 证书映射
      - ./nginx/cert:/etc/nginx/cert
      # 配置文件映射
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf
      # 页面目录
      - ./nginx/html:/usr/share/nginx/html
      # 日志目录
      - my_data:/var/log/nginx
    privileged: true
    networks:
      - my_network

  sentinel:
    image: cdzeroly/sentinel-dashboard:2.2.2
    container_name: platform_sentinel
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8718:8718"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/sentinel-dashboard/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    restart: always
    networks:
      - my_network

  monitor:
    image: cdzeroly/monitor:2.2.2
    container_name: platform_monitor
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9100:9100"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/monitor/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  snailjob-server:
    image: cdzeroly/snailjob-server:2.2.2
    container_name: platform_snailjob_server
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "8800:8800"
      - "17888:17888"
    volumes:
      - my_data:/cdzeroly/snailjob/logs
    privileged: true
    networks:
      - my_network

  gateway:
    image: cdzeroly/gateway:2.2.2
    container_name: platform_gateway
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/gateway/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  auth:
    image: cdzeroly/auth:2.2.2
    container_name: platform_auth
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9210:9210"
    volumes:
      # 配置文件
      - /docker/auth/logs/:/cdzeroly/auth/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  system:
    image: cdzeroly/system:2.2.2
    container_name: platform_system
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9201:9201"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/system/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  gen:
    image: cdzeroly/gen:2.2.2
    container_name: platform_gen
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9202:9202"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/gen/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  job:
    image: cdzeroly/job:2.2.2
    container_name: platform_job
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9203:9203"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/job/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  resource:
    image: cdzeroly/resource:2.2.2
    container_name: platform_resource
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9204:9204"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/resource/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  workflow:
    image: cdzeroly/workflow:2.2.2
    container_name: platform_workflow
    environment:
      # 时区上海
      TZ: Asia/Shanghai
    ports:
      - "9205:9205"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/workflow/logs
      # skywalking 探针
      - /docker/skywalking/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  wvp-zlmediakit:
    build:
      context: ./wvp-zlmediakit
      args:
        zlmGitUrl: "https://gitee.com/xia-chu/ZLMediaKit"
      tags:
        - cdzeroly/wvp-zlmediakit:2.2.2
    restart: always
    ports:
      - "8117:8117"
      - "8117:8117/udp"
      - "18080:18080"
      - "9520:9520"
      - "10000:10000/tcp"
      - "10000:10000/udp"
      - "30000-30500:30000-30500/tcp"
      - "30000-30500:30000-30500/udp"
    volumes:
      - my_data:/opt/media/www/record/
      - my_data:/opt/wvp/logs/
      - my_data:/opt/assist/logs/
      - my_data:/opt/media/log/
    environment:
      TZ: "Asia/Shanghai"
      # [必须修改] 本机的IP
      WVP_HOST: wvp
      WVP_PWD: 12345678
      WVP_DOMAIN: 6101130049
      WVP_ID: 61011300490000000001
      ASSIST_JVM_CONFIG: -Xms128m -Xmx256m
      WVP_JVM_CONFIG: -Xms128m -Xmx256m
      ASSIST_CONFIG:
      WVP_CONFIG:
    networks:
      - my_network

  wvp:
    image: cdzeroly/wvp:2.2.2
    container_name: platform_wvp
    environment:
      # 时区上海
      TZ: Asia/Shanghai
      # [必须修改] 本机的IP
      WVP_HOST: wvp
      ZLM_HOST: zlMediaKit
      WVP_PWD: 12345678
      WVP_DOMAIN: 6101130049
    ports:
      - "18080:18080"
      - "8117:8117/udp"
      - "8117:8117"
    volumes:
      # 配置文件
      - my_data:/cdzeroly/job/logs
      # skywalking 探针
      - ./docker/agent/:/cdzeroly/skywalking/agent
    privileged: true
    networks:
      - my_network

  #################################################################################################
  #################################### 以下为扩展根据需求搭建 #########################################
  #################################################################################################

  rabbitmq:
    image: rabbitmq:3.13.3
    container_name: platform_rabbitmq
    build:
      context: ./rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: 123456
    ports:
      - "15672:15672" # 管理界面端口
      - "5672:5672"   # api 端口
    volumes:
      - my_data:/var/log/rabbitmq
      - my_data:/var/lib/rabbitmq
    networks:
      - my_network




  zlMediaKit:
    image: zlmediakit/zlmediakit:master
    container_name: platform_zlmediakit
    ports:
      - "1935:1935" # rtmp
      - "8554:8554"   # rtsp
      - "9520:9520"   # 服务的端口
      - "443:443"   # https
      - "9521:9521/udp"   # srt
      - "8000:8000/udp"   # rtc
      - "10000:10000"  #  rtp_proxy
      - "10000:10000/udp"  #  rtp_proxy
      - "30000-30500:30000-30500"   #rtsp服务器端口范围
    volumes:
      - my_data:/opt/media/bin/logs
      - ./zlmediakit/conf/config.ini:/opt/media/conf/config.ini
      - ./zlmediakit/conf/default.pem:/opt/media/bin/default.pem
    networks:
      - my_network


networks:
  my_network:
    driver: bridge
volumes:
  my_data:
